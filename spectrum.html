<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Vaagai Live WebRTC Visualizer</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            width: 100vw; height: 100vh; position: relative;
        }
        
        #visualizer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 6; pointer-events: none; opacity: 0; 
            transition: opacity 0.4s ease-in-out; 
        }

        /* 4 மூலைகளுக்கான மையப்புள்ளிகள் */
        .corner-anchor { position: absolute; width: 0; height: 0; }
        #corner-tl { top: 20px; left: 20px; }
        #corner-tr { top: 20px; right: 20px; }
        #corner-bl { bottom: 20px; left: 20px; }
        #corner-br { bottom: 20px; right: 20px; }
        
        /* கதிர்களின் அடிப்படை அமைப்பு */
        .v-bar {
            position: absolute; bottom: 0; left: 0; 
            width: 4px; height: 12px; 
            border-radius: 2px; margin-left: -2px; 
            transform-origin: bottom center; 
            will-change: transform;
        }

        /* இடதுபுற தங்க நிற பின்னணிக்கு -> சிவப்பு நிற கதிர்கள் */
        .bar-red {
            background: linear-gradient(0deg, #ff9999 0%, #ff0000 100%);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.9);
        }
        
        /* வலதுபுற சிவப்பு நிற பின்னணிக்கு -> தங்க நிற கதிர்கள் */
        .bar-gold {
            background: linear-gradient(0deg, #ffe5b4 0%, #ffc16f 100%);
            box-shadow: 0 0 10px rgba(255, 193, 111, 0.9);
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div id="visualizer">
        <div id="corner-tl" class="corner-anchor"></div>
        <div id="corner-tr" class="corner-anchor"></div>
        <div id="corner-bl" class="corner-anchor"></div>
        <div id="corner-br" class="corner-anchor"></div>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'VaagaiSeithigal';
        
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart&stereo&proaudio`;

        const ARC_RADIUS = 35; // மூலைகளிலிருந்து மையத்தை நோக்கி கதிர்கள் தள்ளி வரும் தூரம்
        let analyser, dataArray, vBars = []; 
        let audioCtx; 
        let lastActiveTime = Date.now(); 
        
        const vContainer = document.getElementById('visualizer'); 
        
        // ஒவ்வொரு மூலைக்குமான கோணங்கள் மற்றும் நிறங்கள்
        const corners = [
            { id: 'corner-tl', startAngle: 90, endAngle: 180, colorClass: 'bar-red' },
            { id: 'corner-tr', startAngle: 180, endAngle: 270, colorClass: 'bar-gold' },
            { id: 'corner-bl', startAngle: 0, endAngle: 90, colorClass: 'bar-red' },
            { id: 'corner-br', startAngle: 270, endAngle: 360, colorClass: 'bar-gold' }
        ];
        
        const barsPerCorner = 12;

        // கதிர்களை DOM-ல் உருவாக்குதல்
        corners.forEach(corner => {
            const container = document.getElementById(corner.id);
            const step = (corner.endAngle - corner.startAngle) / (barsPerCorner - 1);
            for(let i = 0; i < barsPerCorner; i++) {
                const b = document.createElement('div'); 
                b.className = `v-bar ${corner.colorClass}`;
                const angle = corner.startAngle + (i * step); 
                b.dataset.angle = angle;
                b.style.transform = `rotate(${angle}deg) translateY(-${ARC_RADIUS}px) scaleY(1)`;
                container.appendChild(b); 
                vBars.push(b);
            }
        });

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; 
                analyser.smoothingTimeConstant = 0.4; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');

            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        const source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }, 1000);

            renderVisualizer();
        }

        const renderVisualizer = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            let totalVolume = 0;
            
            vBars.forEach((bar, index) => {
                let cornerPos = index % 12; 
                // அலைகள் போல் ஏறி இறங்கும் சீரான வடிவம் (Mirroring effect)
                let mapIdx = cornerPos < 6 ? cornerPos : 11 - cornerPos; 
                
                let val = dataArray[2 + mapIdx * 2] || 0; 
                val = Math.max(0, val - 70); 
                
                // மையத்தை நோக்கி கதிர்களை விரியச் செய்தல்
                bar.style.transform = `rotate(${bar.dataset.angle}deg) translateY(-${ARC_RADIUS}px) scaleY(${1 + (val / 15)})`;
                totalVolume += val; 
            });
            
            const avgVol = totalVolume / vBars.length;

            if (avgVol > 3) { 
                lastActiveTime = Date.now(); 
                vContainer.style.opacity = "1";
            } else {
                if (Date.now() - lastActiveTime > 2000) {
                    vContainer.style.opacity = "0";
                }
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
