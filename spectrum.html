<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Vaagai Live WebRTC Spotlight Visualizer</title>
    <style>
        body { 
            background-color: transparent !important; margin: 0; overflow: hidden; 
            width: 100vw; height: 100vh; position: relative;
        }
        
        #visualizer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 6; pointer-events: none; opacity: 0; 
            transition: opacity 0.4s ease-in-out; 
        }

        /* ஒளியின் அடிப்படை அமைப்பு (Spotlight Base) */
        .spotlight {
            position: absolute;
            width: 90px; /* லோகோவை தொடாத பாதுகாப்பான அளவு */
            height: 90px;
            filter: blur(6px); /* ஒளியை மென்மையாக்க */
            will-change: transform, opacity;
            opacity: 0;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
        }

        /* 
           clip-path: polygon() -> இது மூலையில் ஒடுங்கியும், 
           பயணிக்கப் பயணிக்க விரிவடையக்கூடிய ஒளிக்கற்றை வடிவத்தை (Beam) உருவாக்குகிறது.
        */

        /* இடது-மேல் (தங்க நிற ஒளி) */
        #spot-tl {
            top: 0; left: 0;
            transform-origin: top left;
            background: radial-gradient(circle at 0 0, rgba(255, 193, 111, 0.95) 0%, rgba(255, 193, 111, 0) 80%);
            clip-path: polygon(0 0, 100% 25%, 25% 100%);
        }

        /* வலது-மேல் (சிவப்பு நிற ஒளி) */
        #spot-tr {
            top: 0; right: 0;
            transform-origin: top right;
            background: radial-gradient(circle at 100% 0, rgba(255, 0, 0, 0.95) 0%, rgba(255, 0, 0, 0) 80%);
            clip-path: polygon(100% 0, 0 25%, 75% 100%);
        }

        /* இடது-கீழ் (தங்க நிற ஒளி) */
        #spot-bl {
            bottom: 0; left: 0;
            transform-origin: bottom left;
            background: radial-gradient(circle at 0 100%, rgba(255, 193, 111, 0.95) 0%, rgba(255, 193, 111, 0) 80%);
            clip-path: polygon(0 100%, 25% 0, 100% 75%);
        }

        /* வலது-கீழ் (சிவப்பு நிற ஒளி) */
        #spot-br {
            bottom: 0; right: 0;
            transform-origin: bottom right;
            background: radial-gradient(circle at 100% 100%, rgba(255, 0, 0, 0.95) 0%, rgba(255, 0, 0, 0) 80%);
            clip-path: polygon(100% 100%, 0 75%, 75% 0);
        }

        #vdo-engine { position: absolute; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>

    <div id="visualizer">
        <div id="spot-tl" class="spotlight"></div>
        <div id="spot-tr" class="spotlight"></div>
        <div id="spot-bl" class="spotlight"></div>
        <div id="spot-br" class="spotlight"></div>
    </div>
    
    <iframe id="vdo-engine" allow="autoplay; microphone"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'VaagaiSeithigal';
        
        document.getElementById('vdo-engine').src = `./index.html?scene&room=${roomName}&autostart&stereo&proaudio`;

        let analyser, dataArray; 
        let audioCtx; 
        let lastActiveTime = Date.now(); 
        
        const vContainer = document.getElementById('visualizer'); 
        
        // 4 மூலைகளின் Element-களை எடுக்கிறோம்
        const spots = [
            { el: document.getElementById('spot-tl'), freqBin: 2 },
            { el: document.getElementById('spot-tr'), freqBin: 6 },
            { el: document.getElementById('spot-bl'), freqBin: 10 },
            { el: document.getElementById('spot-br'), freqBin: 14 }
        ];

        const connectedTracks = new Set(); 

        function bootVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128; 
                analyser.smoothingTimeConstant = 0.5; // வெளிச்சம் ஸ்மூத்தாக அணைய 0.5 தரப்பட்டுள்ளது
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const iframe = document.getElementById('vdo-engine');

            setInterval(() => {
                try {
                    const iframeWin = iframe.contentWindow;
                    if (iframeWin && iframeWin.RTCPeerConnection && !iframeWin.__lawtamil_rtc_hooked) {
                        
                        const OrigPeerConnection = iframeWin.RTCPeerConnection;
                        
                        iframeWin.RTCPeerConnection = function(...args) {
                            const pc = new OrigPeerConnection(...args);
                            
                            pc.addEventListener('track', (event) => {
                                const track = event.track;
                                if (track.kind === 'audio' && !connectedTracks.has(track.id)) {
                                    connectedTracks.add(track.id);
                                    try {
                                        if (audioCtx.state === 'suspended') audioCtx.resume();
                                        const cleanStream = new MediaStream([track]);
                                        const source = audioCtx.createMediaStreamSource(cleanStream);
                                        source.connect(analyser); 
                                    } catch(err) {}
                                }
                            });
                            return pc;
                        };
                        
                        iframeWin.RTCPeerConnection.prototype = OrigPeerConnection.prototype;
                        Object.assign(iframeWin.RTCPeerConnection, OrigPeerConnection); 
                        
                        iframeWin.__lawtamil_rtc_hooked = true;
                    }
                } catch (e) {} 
            }, 10);

            setInterval(() => {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }, 1000);

            renderVisualizer();
        }

        const renderVisualizer = () => {
            if (!analyser) return; 
            requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);
            
            let isActive = false;

            spots.forEach(spotObj => {
                const val = dataArray[spotObj.freqBin] || 0; 
                let cleanVal = Math.max(0, val - 35); // Noise Threshold
                
                if (cleanVal > 2) isActive = true;

                // லோகோவை சீண்டாதவாறு Scale அதிகபட்சம் 1.5 என கட்டுப்படுத்தப்பட்டுள்ளது
                let scaleVal = 0.5 + (cleanVal / 50); 
                if(scaleVal > 1.5) scaleVal = 1.5; 

                // ஒலியின் அளவிற்கு ஏற்ப வெளிச்சம் (Opacity) மாறுபடும்
                let opacityVal = Math.min(0.9, cleanVal / 25);

                spotObj.el.style.transform = `scale(${scaleVal})`;
                spotObj.el.style.opacity = opacityVal;
            });
            
            if (isActive) { 
                lastActiveTime = Date.now(); 
                vContainer.style.opacity = "1";
            } else if (Date.now() - lastActiveTime > 1500) {
                // 1.5 வினாடி சத்தம் இல்லை என்றால் மொத்தமாக அணைந்துவிடும்
                vContainer.style.opacity = "0";
                spots.forEach(spotObj => {
                    spotObj.el.style.transform = "scale(0.5)";
                    spotObj.el.style.opacity = "0";
                });
            }
        };

        window.addEventListener('load', bootVisualizer);
    </script>
</body>
</html>
